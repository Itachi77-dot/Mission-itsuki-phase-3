<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Discover anime details, ratings, episodes, genres and trailers on ITSUKI ANIMES."
  >

  <meta
    name="theme-color"
    content="#07070d"
  >

  <title>Anime Details — ITSUKI ANIMES</title>

  <!-- =========================
       MAIN CSS
  ========================= -->

  <link
    rel="stylesheet"
    href="style.css"
  >


  <!-- =========================
       GOOGLE FONTS
  ========================= -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

</head>


<body>

  <!-- =========================
       BACKGROUND EFFECTS
  ========================= -->

  <div
    class="bg-glow glow-one"
    aria-hidden="true"
  ></div>

  <div
    class="bg-glow glow-two"
    aria-hidden="true"
  ></div>


  <!-- =========================
       NAVBAR
  ========================= -->

  <header class="navbar">

    <!-- BRAND -->

    <a
      href="index.html"
      class="brand"
      aria-label="ITSUKI ANIMES Home"
    >

      <div
        class="brand-icon"
        aria-hidden="true"
      >
        I
      </div>

      <div class="brand-name">
        ITSUKI
        <span>ANIMES</span>
      </div>

    </a>


    <!-- NAV ACTIONS -->

    <nav
      class="details-nav"
      aria-label="Anime navigation"
    >

      <a
        href="index.html"
        class="back-btn"
        aria-label="Back to home"
      >

        <span aria-hidden="true">
          ←
        </span>

        <span>
          Back Home
        </span>

      </a>

    </nav>

  </header>


  <!-- =========================
       MAIN CONTENT
  ========================= -->

  <main class="details-page">

    <!-- =========================
         ANIME DETAILS ENGINE
    ========================= -->

    <section
      id="anime-details"
      class="anime-details-container"
      aria-live="polite"
      aria-busy="true"
    >

      <!-- =========================
           LOADING STATE
      ========================= -->

      <div class="details-loading">

        <div
          class="details-loading-spinner"
          aria-hidden="true"
        ></div>

        <p>
          Loading anime details...
        </p>

        <span>
          Please wait
        </span>

      </div>

    </section>


    <!-- =========================
         WATCH EXPERIENCE
         
         This container is kept
         ready for the Phase 3
         episode/watch system.
    ========================= -->

    <section
      id="watch-section"
      class="watch-section"
      hidden
      aria-label="Anime watch section"
    >

      <div class="watch-header">

        <div>
          <span class="section-kicker">
            WATCH
          </span>

          <h2>
            Watch Anime
          </h2>
        </div>

      </div>


      <!-- PLAYER -->

      <div
        id="anime-player"
        class="anime-player"
      >

        <div class="player-placeholder">

          <div
            class="player-icon"
            aria-hidden="true"
          >
            ▶
          </div>

          <p>
            Select an episode to start watching.
          </p>

        </div>

      </div>


      <!-- EPISODES -->

      <div
        id="episodes-section"
        class="episodes-section"
      >

        <div class="episodes-header">

          <div>
            <span class="section-kicker">
              EPISODES
            </span>

            <h2>
              Episodes
            </h2>
          </div>

        </div>


        <div
          id="episodes-list"
          class="episodes-list"
          aria-live="polite"
        >

          <!-- Episodes will be inserted by anime.js -->

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================= -->

  <footer class="details-footer">

    <div class="footer-brand">

      <div
        class="brand-icon"
        aria-hidden="true"
      >
        I
      </div>

      <div class="brand-name">
        ITSUKI
        <span>ANIMES</span>
      </div>

    </div>


    <p>
      © 2026 ITSUKI ANIMES. All rights reserved.
    </p>

    <p>
      Made with ❤️ for anime fans.
    </p>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================= -->

  <script
    src="anime.js"
    defer
  ></script>

</body>

</html>
