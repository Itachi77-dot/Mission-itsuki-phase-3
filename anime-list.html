<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Anime Collection — ITSUKI ANIMES</title>

  <link rel="stylesheet" href="./style.css">

  <style>
    /* =========================
       COLLECTION PAGE
    ========================= */

    .collection-page {
      min-height: 100vh;
      padding: 110px 6% 60px;
    }

    .collection-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 35px;
    }

    .collection-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: #fff;
      opacity: .8;
      transition: .3s;
    }

    .collection-back:hover {
      opacity: 1;
      transform: translateX(-4px);
    }

    .collection-heading {
      margin-bottom: 20px;
    }

    .collection-heading h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    .collection-heading p {
      margin-top: 8px;
      opacity: .65;
    }

    /* =========================
       STATUS
    ========================= */

    #collection-status {
      text-align: center;
      padding: 45px 20px;
      opacity: .75;
    }

    .collection-error {
      text-align: center;
      padding: 30px 20px;
    }

    .collection-error h2 {
      margin-bottom: 10px;
    }

    .collection-error p {
      opacity: .65;
      margin-bottom: 25px;
    }

    /* =========================
       RETRY BUTTON
    ========================= */

    .retry-btn {
      border: none;
      cursor: pointer;
      padding: 12px 24px;
      border-radius: 12px;
      color: white;
      background: linear-gradient(
        135deg,
        #8b5cf6,
        #ec4899
      );
      font-weight: 600;
      transition: .3s;
    }

    .retry-btn:hover {
      transform: translateY(-2px);
    }

    /* =========================
       LOAD MORE
    ========================= */

    #load-more-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 45px;
    }

    #load-more-btn {
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.06);
      color: white;
      padding: 13px 30px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: .3s;
    }

    #load-more-btn:hover {
      background: rgba(255,255,255,.12);
      transform: translateY(-2px);
    }

    #load-more-btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .collection-page {
        padding: 95px 5% 45px;
      }

      .collection-top {
        align-items: flex-start;
        flex-direction: column;
      }

    }
  </style>
</head>


<body>

  <!-- =========================
       NAVBAR
  ========================= -->

  <nav class="navbar">

    <a
      href="./index.html"
      class="logo"
    >
      ITSUKI ANIMES
    </a>


    <div class="nav-links">

      <a href="./index.html">
        Home
      </a>

      <a href="./index.html#trending">
        Trending
      </a>

      <a href="./index.html#popular">
        Popular
      </a>

      <a href="./index.html#new">
        New
      </a>

    </div>


    <div class="nav-actions">

      <button
        class="search-btn"
        id="search-btn"
        aria-label="Search"
      >
        🔍
      </button>


      <button
        class="menu-btn"
        id="menu-btn"
        aria-label="Menu"
      >
        ☰
      </button>

    </div>

  </nav>


  <!-- =========================
       MOBILE MENU
  ========================= -->

  <div
    class="mobile-menu"
    id="mobile-menu"
  >

    <a href="./index.html">
      Home
    </a>

    <a href="./index.html#trending">
      Trending
    </a>

    <a href="./index.html#popular">
      Popular
    </a>

    <a href="./index.html#new">
      New Releases
    </a>

    <a href="./index.html">
      Search Anime
    </a>

  </div>


  <!-- =========================
       COLLECTION PAGE
  ========================= -->

  <main class="collection-page">


    <!-- BACK BUTTON -->

    <div class="collection-top">

      <a
        href="./index.html"
        class="collection-back"
      >
        ← Back to Home
      </a>

    </div>


    <!-- HEADING -->

    <div class="collection-heading">

      <h1 id="collection-title">
        Anime Collection
      </h1>

      <p id="collection-subtitle">
        Discover your next favorite anime.
      </p>

    </div>


    <!-- STATUS -->

    <div id="collection-status">
      Loading anime...
    </div>


    <!-- ANIME GRID -->

    <div
      class="anime-grid"
      id="collection-grid"
    ></div>


    <!-- LOAD MORE -->

    <div
      id="load-more-wrapper"
      style="display:none;"
    >

      <button
        id="load-more-btn"
      >
        Load More
      </button>

    </div>

  </main>


  <!-- =========================
       MAIN SCRIPT
  ========================= -->

  <script src="./script.js"></script>


  <!-- =========================
       COLLECTION SCRIPT
  ========================= -->

  <script>

    /* =========================
       ANILIST API
       IMPORTANT:
       Different name from script.js
       to avoid duplicate const error.
    ========================= */

    const COLLECTION_ANILIST_API =
      "https://graphql.anilist.co";


    /* =========================
       STATE
    ========================= */

    let currentPage = 1;

    let currentType = "trending";

    let hasNextPage = true;

    let isLoading = false;


    /* =========================
       GET URL TYPE
    ========================= */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const type =
      params.get("type");


    if (
      type === "popular" ||
      type === "new"
    ) {

      currentType = type;

    }


    /* =========================
       PAGE TITLES
    ========================= */

    const titles = {

      trending: {

        title:
          "Trending Anime",

        subtitle:
          "The anime everyone is watching right now."

      },


      popular: {

        title:
          "Popular Anime",

        subtitle:
          "Discover the most popular anime."

      },


      new: {

        title:
          "New Releases",

        subtitle:
          "Explore the latest anime releases."

      }

    };


    document.getElementById(
      "collection-title"
    ).textContent =
      titles[currentType].title;


    document.getElementById(
      "collection-subtitle"
    ).textContent =
      titles[currentType].subtitle;


    /* =========================
       GRAPHQL QUERY
    ========================= */

    const COLLECTION_QUERY = `

      query (
        $page: Int
        $perPage: Int
        $sort: [MediaSort]
      ) {

        Page(
          page: $page
          perPage: $perPage
        ) {

          pageInfo {

            currentPage

            hasNextPage

            lastPage

          }


          media(

            type: ANIME

            isAdult: false

            sort: $sort

          ) {


            id


            title {

              romaji

              english

              native

            }


            coverImage {

              extraLarge

              large

              medium

            }


            bannerImage


            description


            episodes


            averageScore


            season


            seasonYear


            startDate {

              year

              month

              day

            }


            genres


            format

          }

        }

      }

    `;


    /* =========================
       GET SORT
    ========================= */

    function getSort() {

      if (
        currentType ===
        "popular"
      ) {

        return [
          "POPULARITY_DESC"
        ];

      }


      if (
        currentType ===
        "new"
      ) {

        return [
          "START_DATE_DESC"
        ];

      }


      return [
        "TRENDING_DESC"
      ];

    }


    /* =========================
       FETCH ANILIST
    ========================= */

    async function fetchAnime(
      page
    ) {

      const controller =
        new AbortController();


      const timeout =
        setTimeout(
          () => {

            controller.abort();

          },
          15000
        );


      try {

        const response =
          await fetch(
            COLLECTION_ANILIST_API,
            {

              method:
                "POST",


              headers: {

                "Content-Type":
                  "application/json",

                "Accept":
                  "application/json"

              },


              body:
                JSON.stringify({

                  query:
                    COLLECTION_QUERY,

                  variables: {

                    page:
                      page,

                    perPage:
                      24,

                    sort:
                      getSort()

                  }

                }),


              signal:
                controller.signal

            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            "AniList server error: " +
            response.status
          );

        }


        const data =
          await response.json();


        if (
          data.errors &&
          data.errors.length
        ) {

          throw new Error(
            data.errors[0].message ||
            "AniList API error"
          );

        }


        if (
          !data.data ||
          !data.data.Page
        ) {

          throw new Error(
            "Invalid AniList response"
          );

        }


        return data.data.Page;

      }


      finally {

        clearTimeout(
          timeout
        );

      }

    }


    /* =========================
       NORMALIZE ANIME
    ========================= */

    function normalizeCollectionAnime(
      anime
    ) {

      return {

        mal_id:
          anime.id,

        id:
          anime.id,


        title:
          anime.title?.english ||
          anime.title?.romaji ||
          anime.title?.native ||
          "Unknown Anime",


        title_english:
          anime.title?.english ||
          anime.title?.romaji ||
          "Unknown Anime",


        images: {

          jpg: {

            large_image_url:

              anime.coverImage?.extraLarge ||

              anime.coverImage?.large ||

              anime.coverImage?.medium ||

              ""

          }

        },


        score:

          anime.averageScore
            ? anime.averageScore / 10
            : null,


        episodes:
          anime.episodes || null,


        year:

          anime.seasonYear ||

          anime.startDate?.year ||

          null,


        synopsis:

          anime.description

            ? anime.description
                .replace(
                  /<[^>]*>/g,
                  ""
                )

            : "",


        genres:

          (anime.genres || [])
            .map(
              genre => ({

                name:
                  genre

              })
            ),


        trailer: {

          embed_url:
            null

        }

      };

    }


    /* =========================
       FALLBACK CARD
    ========================= */

    function createFallbackCard(
      anime
    ) {

      const card =
        document.createElement(
          "div"
        );


      card.className =
        "anime-card";


      const image =
        anime.images?.jpg
          ?.large_image_url ||
        "";


      card.innerHTML = `

        <img
          src="${image}"
          alt="${anime.title}"
          loading="lazy"
        >

        <div class="anime-card-content">

          <h3>
            ${anime.title}
          </h3>

          ${
            anime.score
              ? `
                <p>
                  ⭐ ${anime.score.toFixed(1)}
                </p>
              `
              : ""
          }

        </div>

      `;


      card.addEventListener(
        "click",
        () => {

          window.location.href =
            "./anime.html?id=" +
            anime.id;

        }
      );


      return card;

    }


    /* =========================
       LOAD ANIME
    ========================= */

    async function loadAnime(
      page = 1,
      append = false
    ) {

      if (isLoading) {
        return;
      }


      if (
        !hasNextPage &&
        append
      ) {

        return;

      }


      isLoading = true;


      const status =
        document.getElementById(
          "collection-status"
        );


      const grid =
        document.getElementById(
          "collection-grid"
        );


      const loadMore =
        document.getElementById(
          "load-more-btn"
        );


      const wrapper =
        document.getElementById(
          "load-more-wrapper"
        );


      /* =========================
         LOADING STATE
      ========================= */

      if (!append) {

        status.style.display =
          "block";

        status.textContent =
          "Loading anime...";

      }


      if (append) {

        loadMore.disabled =
          true;

        loadMore.textContent =
          "Loading...";

      }


      try {

        const result =
          await fetchAnime(
            page
          );


        const animeList =
          result.media || [];


        /* =========================
           EMPTY RESULT
        ========================= */

        if (
          !animeList.length
        ) {

          if (!append) {

            status.textContent =
              "No anime found.";

          }


          hasNextPage =
            false;


          wrapper.style.display =
            "none";


          return;

        }


        /* =========================
           ADD CARDS
        ========================= */

        animeList.forEach(
          anime => {

            const normalized =
              normalizeCollectionAnime(
                anime
              );


            let cardHTML = null;


            /*
              Use existing card design
              from script.js if available.
            */

            if (
              typeof createAnimeCard ===
              "function"
            ) {

              try {

                cardHTML =
                  createAnimeCard(
                    normalized
                  );

              }

              catch (error) {

                console.warn(
                  "createAnimeCard failed:",
                  error
                );

              }

            }


            if (
              typeof cardHTML ===
              "string" &&
              cardHTML.trim()
            ) {

              grid.insertAdjacentHTML(
                "beforeend",
                cardHTML
              );

            }

            else {

              grid.appendChild(
                createFallbackCard(
                  normalized
                )
              );

            }

          }
        );


        /* =========================
           PAGE INFO
        ========================= */

        hasNextPage =
          Boolean(
            result.pageInfo &&
            result.pageInfo.hasNextPage
          );


        currentPage =
          result.pageInfo?.currentPage ||
          page;


        /* =========================
           HIDE STATUS
        ========================= */

        status.style.display =
          "none";


        /* =========================
           LOAD MORE
        ========================= */

        if (
          hasNextPage
        ) {

          wrapper.style.display =
            "flex";

          loadMore.style.display =
            "block";

          loadMore.disabled =
            false;

          loadMore.textContent =
            "Load More";

        }

        else {

          wrapper.style.display =
            "none";

        }

      }


      catch (error) {

        console.error(
          "ITSUKI collection error:",
          error
        );


        /* =========================
           ERROR MESSAGE
        ========================= */

        status.style.display =
          "block";


        status.innerHTML = `

          <div
            class="collection-error"
          >

            <h2>
              Unable to load anime
            </h2>

            <p>
              The anime service could not
              be reached. Please check your
              internet connection and try again.
            </p>

            <button
              class="retry-btn"
              id="retry-btn"
            >
              Try Again
            </button>

          </div>

        `;


        wrapper.style.display =
          "none";


        const retryBtn =
          document.getElementById(
            "retry-btn"
          );


        if (retryBtn) {

          retryBtn.addEventListener(
            "click",
            () => {

              currentPage =
                1;

              hasNextPage =
                true;

              grid.innerHTML =
                "";

              loadAnime(
                1,
                false
              );

            }
          );

        }

      }


      finally {

        isLoading =
          false;

      }

    }


    /* =========================
       LOAD MORE BUTTON
    ========================= */

    document
      .getElementById(
        "load-more-btn"
      )
      .addEventListener(
        "click",
        () => {

          if (
            hasNextPage &&
            !isLoading
          ) {

            loadAnime(
              currentPage + 1,
              true
            );

          }

        }
      );


    /* =========================
       MOBILE MENU
    ========================= */

    const collectionMenuBtn =
      document.getElementById(
        "menu-btn"
      );


    const collectionMobileMenu =
      document.getElementById(
        "mobile-menu"
      );


    if (
      collectionMenuBtn &&
      collectionMobileMenu
    ) {

      collectionMenuBtn.addEventListener(
        "click",
        () => {

          collectionMobileMenu
            .classList
            .toggle(
              "active"
            );

        }
      );

    }


    /* =========================
       MOBILE MENU LINKS
    ========================= */

    if (
      collectionMobileMenu
    ) {

      collectionMobileMenu
        .querySelectorAll("a")
        .forEach(
          link => {

            link.addEventListener(
              "click",
              () => {

                collectionMobileMenu
                  .classList
                  .remove(
                    "active"
                  );

              }
            );

          }
        );

    }


    /* =========================
       START COLLECTION
    ========================= */

    loadAnime(
      1,
      false
    );

  </script>

</body>

</html>
